[project]
name = "rutgers-catalog-mcp"
version = "0.1.0"
description = "Public, zero-auth MCP servers for Rutgers Schedule of Classes, Middlesex College courses, and NJ Transfer equivalencies"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Shachin Ramkumar" }]
dependencies = [
    "httpx>=0.28,<1",
    "mcp>=2.3,<3",
    "platformdirs>=4,<5",
    "tzdata>=2025.2; sys_platform == 'win32'",
]

[project.urls]
Repository = "https://github.com/ShachinRamkumar/rutgers-catalog-mcp"

[project.scripts]
rutgers-soc-mcp = "rutgers_soc_mcp.server:main"
middlesex-courses-mcp = "middlesex_courses_mcp.server:main"
nj-transfer-mcp = "nj_transfer_mcp.server:main"

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "pytest-cov>=6,<8",
    "ruff>=0.12,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "src/rutgers_soc_mcp",
    "src/middlesex_courses_mcp",
    "src/nj_transfer_mcp",
]

[tool.hatch.build.targets.sdist]
only-include = [
    "src",
    "tests",
    "scripts",
    "README.md",
    "LICENSE",
    "pyproject.toml",
    "uv.lock",
    "Dockerfile",
    ".dockerignore",
    ".github/workflows/ci.yml",
    ".gitignore",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
