<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 548" width="980" height="548" role="img" aria-label="Rutgers Catalog MCP architecture diagram">
  <defs>
    <marker id="arrow-dark" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 1 1.5 L 8.5 5 L 1 8.5 z" fill="#8b949e"/>
    </marker>
    <clipPath id="clip-soc-dark"><rect x="240" y="46" width="308" height="122" rx="9"/></clipPath>
    <clipPath id="clip-mcc-dark"><rect x="240" y="224" width="308" height="124" rx="9"/></clipPath>
    <clipPath id="clip-njt-dark"><rect x="240" y="398" width="308" height="124" rx="9"/></clipPath>
    <style>
      .col-hdr { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 11px; font-weight: 700; letter-spacing: 0.08em; }
      .title-md { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 14px; font-weight: 700; }
      .title-sm { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 12.5px; font-weight: 700; }
      .sub-sm { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 11px; font-weight: 500; }
      .mono-title { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 12.5px; font-weight: 700; }
      .mono-tool { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 11.5px; font-weight: 500; }
      .mono-xs { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 10.5px; font-weight: 500; }
      .edge-label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 10.5px; font-weight: 600; }
      .edge-label-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 10px; font-weight: 500; }
    </style>
  </defs>

  <!-- Column Headers -->
  <text x="88" y="22" text-anchor="middle" class="col-hdr" fill="#8b949e">CLIENT</text>
  <text x="394" y="22" text-anchor="middle" class="col-hdr" fill="#8b949e">LOCAL MCP SERVERS</text>
  <text x="826" y="22" text-anchor="middle" class="col-hdr" fill="#8b949e">CACHES &amp; UPSTREAM APIS</text>

  <!-- Client to Servers connectors (stdio) -->
  <g fill="none" stroke="#8b949e" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <line x1="152" y1="286" x2="212" y2="286"/>
    <path d="M 212 286 V 115 Q 212 107 220 107 H 237" marker-end="url(#arrow-dark)"/>
    <line x1="212" y1="286" x2="237" y2="286" marker-end="url(#arrow-dark)"/>
    <path d="M 212 286 V 452 Q 212 460 220 460 H 237" marker-end="url(#arrow-dark)"/>
  </g>
  
  <g>
    <rect x="160.0" y="275.0" width="44" height="22" rx="6"
          fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <text x="182" y="290" text-anchor="middle" class="edge-label" fill="#c9d1d9">stdio</text>
  </g>

  <!-- Server to Cache/API connectors -->
  <g fill="none" stroke="#8b949e" stroke-width="1.6" stroke-linecap="round">
    <line x1="551" y1="74" x2="689" y2="74" marker-start="url(#arrow-dark)" marker-end="url(#arrow-dark)"/>
    <line x1="548" y1="149" x2="689" y2="149" marker-end="url(#arrow-dark)"/>
    <line x1="548" y1="286" x2="689" y2="286" marker-end="url(#arrow-dark)"/>
    <line x1="551" y1="425" x2="689" y2="425" marker-start="url(#arrow-dark)" marker-end="url(#arrow-dark)"/>
    <line x1="548" y1="500" x2="689" y2="500" marker-end="url(#arrow-dark)"/>
  </g>

  <!-- Edge Labels -->
  
  <g>
    <rect x="576.0" y="138.0" width="80" height="22" rx="6"
          fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <text x="616" y="153" text-anchor="middle" class="edge-label" fill="#c9d1d9">HTTPS GET</text>
  </g>
  
  <g>
    <rect x="561.0" y="269.0" width="110" height="34" rx="6"
          fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <text x="616" y="283" text-anchor="middle" class="edge-label" fill="#c9d1d9">HTTPS GET/POST</text>
    <text x="616" y="297" text-anchor="middle" class="edge-label-sub" fill="#8b949e">guest session</text>
  </g>
  
  <g>
    <rect x="561.0" y="489.0" width="110" height="22" rx="6"
          fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <text x="616" y="504" text-anchor="middle" class="edge-label" fill="#c9d1d9">HTTPS GET/POST</text>
  </g>

  <!-- Client Box -->
  <g>
    <rect x="24" y="250" width="128" height="72" rx="10"
          fill="#12263f" stroke="#388bfd" stroke-width="1.6"/>
    <text x="88" y="281" text-anchor="middle" class="title-md" fill="#79c0ff">MCP Client</text>
    <text x="88" y="301" text-anchor="middle" class="mono-tool" fill="#58a6ff">(stdio)</text>
  </g>

  <!-- Server Boxes -->
  
  <!-- Server: rutgers-soc-mcp -->
  <g>
    <g clip-path="url(#clip-soc-dark)">
      <rect x="240" y="46" width="308" height="122" fill="#161b22"/>
      <rect x="240" y="46" width="308" height="34" fill="#1c2128"/>
      <line x1="240" y1="80" x2="548" y2="80" stroke="#30363d" stroke-width="1"/>
      <rect x="240" y="46" width="5" height="122" fill="#a371f7"/>
    </g>
    <rect x="240" y="46" width="308" height="122" rx="9" fill="none" stroke="#30363d" stroke-width="1.5"/>
    <text x="258" y="68" class="mono-title" fill="#f0f6fc">rutgers-soc-mcp</text>
    <text x="258" y="117.5" class="mono-tool" fill="#9198a1">SoC_Get_Course</text>
    <text x="258" y="138.5" class="mono-tool" fill="#9198a1">SoC_Search_Courses</text>
  </g>
  
  <!-- Server: middlesex-courses-mcp -->
  <g>
    <g clip-path="url(#clip-mcc-dark)">
      <rect x="240" y="224" width="308" height="124" fill="#161b22"/>
      <rect x="240" y="224" width="308" height="34" fill="#1c2128"/>
      <line x1="240" y1="258" x2="548" y2="258" stroke="#30363d" stroke-width="1"/>
      <rect x="240" y="224" width="5" height="124" fill="#a371f7"/>
    </g>
    <rect x="240" y="224" width="308" height="124" rx="9" fill="none" stroke="#30363d" stroke-width="1.5"/>
    <text x="258" y="246" class="mono-title" fill="#f0f6fc">middlesex-courses-mcp</text>
    <text x="258" y="286.0" class="mono-tool" fill="#9198a1">Middlesex_Search_Options</text>
    <text x="258" y="307.0" class="mono-tool" fill="#9198a1">Middlesex_Search_Classes</text>
    <text x="258" y="328.0" class="mono-tool" fill="#9198a1">Middlesex_Class_Details</text>
  </g>
  
  <!-- Server: nj-transfer-mcp -->
  <g>
    <g clip-path="url(#clip-njt-dark)">
      <rect x="240" y="398" width="308" height="124" fill="#161b22"/>
      <rect x="240" y="398" width="308" height="34" fill="#1c2128"/>
      <line x1="240" y1="432" x2="548" y2="432" stroke="#30363d" stroke-width="1"/>
      <rect x="240" y="398" width="5" height="124" fill="#a371f7"/>
    </g>
    <rect x="240" y="398" width="308" height="124" rx="9" fill="none" stroke="#30363d" stroke-width="1.5"/>
    <text x="258" y="420" class="mono-title" fill="#f0f6fc">nj-transfer-mcp</text>
    <text x="258" y="460.0" class="mono-tool" fill="#9198a1">NJTransfer_Find_Middlesex_Equivalents</text>
    <text x="258" y="481.0" class="mono-tool" fill="#9198a1">NJTransfer_Middlesex_Course</text>
    <text x="258" y="502.0" class="mono-tool" fill="#9198a1">NJTransfer_Search</text>
  </g>

  <!-- Right Column: Caches & APIs -->
  
  <!-- Cylinder: Disk Cache -->
  <g>
    <path d="M 694 49 L 694 99 A 132.0 9 0 0 0 958 99 L 958 49 Z"
          fill="#272115" stroke="#bb8009" stroke-width="1.5"/>
    <ellipse cx="826.0" cy="49" rx="132.0" ry="9"
             fill="#352c18" stroke="#bb8009" stroke-width="1.5"/>
    <text x="826.0" y="74" text-anchor="middle" class="title-sm" fill="#f2cc60">Disk Cache</text>
    <text x="826.0" y="91" text-anchor="middle" class="sub-sm" fill="#d29922">ETag + max-age · stale fallback</text>
  </g>
  
  <!-- API: classes.rutgers.edu/soc/api -->
  <g>
    <rect x="694" y="120" width="264" height="58" rx="8"
          fill="#12261e" stroke="#2ea043" stroke-width="1.5"/>
    <text x="826.0" y="144" text-anchor="middle" class="mono-title" fill="#56d364">classes.rutgers.edu/soc/api</text>
    <text x="826.0" y="163" text-anchor="middle" class="mono-xs" fill="#7ee787">courses.json + openSections.json</text>
  </g>

  
  <!-- API: Middlesex Ellucian -->
  <g>
    <rect x="694" y="257" width="264" height="58" rx="8"
          fill="#12261e" stroke="#2ea043" stroke-width="1.5"/>
    <text x="826.0" y="281" text-anchor="middle" class="mono-title" fill="#56d364">Middlesex Ellucian</text>
    <text x="826.0" y="300" text-anchor="middle" class="sub-sm" fill="#7ee787">Guest Course Catalog</text>
  </g>

  
  <!-- Cylinder: Disk + Memory Cache -->
  <g>
    <path d="M 694 400 L 694 450 A 132.0 9 0 0 0 958 450 L 958 400 Z"
          fill="#272115" stroke="#bb8009" stroke-width="1.5"/>
    <ellipse cx="826.0" cy="400" rx="132.0" ry="9"
             fill="#352c18" stroke="#bb8009" stroke-width="1.5"/>
    <text x="826.0" y="425" text-anchor="middle" class="title-sm" fill="#f2cc60">Disk + Memory Cache</text>
    <text x="826.0" y="442" text-anchor="middle" class="sub-sm" fill="#d29922">24h export / 15m details</text>
  </g>
  
  <!-- API: njtransfer.org -->
  <g>
    <rect x="694" y="471" width="264" height="58" rx="8"
          fill="#12261e" stroke="#2ea043" stroke-width="1.5"/>
    <text x="826.0" y="495" text-anchor="middle" class="mono-title" fill="#56d364">njtransfer.org</text>
    <text x="826.0" y="514" text-anchor="middle" class="sub-sm" fill="#7ee787">Equivalency Export + Details</text>
  </g>
</svg>
